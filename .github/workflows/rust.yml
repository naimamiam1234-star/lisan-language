name: Rust CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit and integration tests
        run: cargo test --all-targets
      - name: Compile and execute real native Lisan binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v clang
          cargo run -- --emit-llvm examples/native.lsn --output native.ll
          grep -F 'define i32 @main' native.ll
          cargo run -- --native examples/native.lsn --output native-sample
          printf '0\n1\n9\n16\nانتهى\n' > expected-native.txt
          ./native-sample > actual-native.txt
          diff -u expected-native.txt actual-native.txt
          file native-sample
      - name: Upload generated native Lisan sample (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lisan-genuine-native-Linux
          path: native-sample
      - name: Compile optimized interpreter
        run: cargo build --release
      - name: Run Arabic samples
        run: |
          cargo run -- --interpret examples/hello.lsn
          cargo run -- --interpret examples/dictionary.lsn
          cargo run -- --interpret examples/standard_library.lsn
          cargo run -- --tokens examples/dictionary.lsn
          cargo run -- --ast examples/dictionary.lsn
          cargo run -- --interpret examples/functions.lsn
          cargo run -- --interpret examples/lists.lsn
          cargo run -- --interpret examples/text.lsn
          cargo run -- --interpret examples/modules/main.lsn
          cargo run -- --check examples/modules/main.lsn
          cargo run -- --test examples/testing.lsn
      - name: Build a standalone Lisan sample (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo run -- --build examples/modules/main.lsn --output standalone-sample
          ./standalone-sample | grep -F 'مربع 7 = 49'
      - name: Build a standalone Lisan sample (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -- --build examples/modules/main.lsn --output standalone-sample.exe
          $actual = & .\standalone-sample.exe
          if ($LASTEXITCODE -ne 0 -or $actual -ne 'مربع 7 = 49') { throw "Standalone sample failed: $actual" }
      - name: Package standalone Arabic sample (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf lisan-sample-${{ runner.os }}.tar.gz standalone-sample
      - name: Package standalone Arabic sample (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path standalone-sample.exe -DestinationPath lisan-sample-Windows.zip
      - name: Upload standalone Arabic application
        uses: actions/upload-artifact@v4
        with:
          name: lisan-standalone-sample-${{ runner.os }}
          path: |
            lisan-sample-*.tar.gz
            lisan-sample-*.zip
          if-no-files-found: error
      - name: Package Linux/macOS interpreter
        if: runner.os != 'Windows'
        run: tar -czf lisan-${{ runner.os }}.tar.gz -C target/release lisan
      - name: Package Windows interpreter
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/lisan.exe -DestinationPath lisan-Windows.zip
      - name: Upload ready-to-run interpreter
        uses: actions/upload-artifact@v4
        with:
          name: lisan-${{ runner.os }}
          path: |
            lisan-*.tar.gz
            lisan-*.zip
          if-no-files-found: error
