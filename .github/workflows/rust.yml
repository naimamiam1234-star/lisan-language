name: Rust native CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.75.0
      - name: Provision Linux Clang 18
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libclang-rt-18-dev build-essential
          echo 'LISAN_CLANG=clang-18' >> "$GITHUB_ENV"
      - name: Provision Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Provision Windows Clang 18
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: '18.1.8'
          arch: x64
      - name: Validate Linux native compilation and execution
        if: runner.os == 'Linux'
        run: sh scripts/check-linux.sh
      - name: Validate Windows native compilation and execution
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows.ps1
      - name: Compile native release samples (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          for sample in native native_collections native_math native_typed native_text native_text_control native_text_functions; do
            ./target/release/lisan --native "examples/$sample.lsn" --output "dist/$sample"
            "./dist/$sample"
          done
          ./target/release/lisan --native examples/ffi/import.lsn --link examples/ffi/adapter.c --output dist/native-ffi
          ./dist/native-ffi
          ./target/release/lisan --emit-object examples/ffi/library.lsn --output dist/lisan-library.o
          cp target/release/lisan dist/
          mkdir -p dist/docs dist/examples
          cp LICENSE README.md dist/
          cp docs/NATIVE-TYPES.md docs/MEMORY-POINTERS.md docs/MANAGED-VALUES.md docs/STDLIB-STATUS.md dist/docs/
          cp -R examples/ffi dist/examples/
          cp examples/native_typed.lsn examples/native_text.lsn examples/native_text_control.lsn examples/native_text_functions.lsn dist/examples/
          cp -R runtime dist/
          tar -czf lisan-native-Linux.tar.gz -C dist .
          sha256sum lisan-native-Linux.tar.gz > lisan-native-Linux.sha256
      - name: Compile native release samples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          foreach ($sample in @('native', 'native_collections', 'native_math', 'native_typed', 'native_text', 'native_text_control', 'native_text_functions')) {
            & ./target/release/lisan.exe --native "examples/$sample.lsn" --output "dist/$sample.exe"
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $sample" }
            & "./dist/$sample.exe"
            if ($LASTEXITCODE -ne 0) { throw "Execution failed: $sample" }
          }
          & ./target/release/lisan.exe --native examples/ffi/import.lsn --link examples/ffi/adapter.c --output dist/native-ffi.exe
          if ($LASTEXITCODE -ne 0) { throw 'C FFI compilation failed' }
          & ./dist/native-ffi.exe
          if ($LASTEXITCODE -ne 0) { throw 'C FFI execution failed' }
          & ./target/release/lisan.exe --emit-object examples/ffi/library.lsn --output dist/lisan-library.obj
          if ($LASTEXITCODE -ne 0) { throw 'Library object compilation failed' }
          Copy-Item target/release/lisan.exe dist/
          New-Item -ItemType Directory -Path dist/docs,dist/examples | Out-Null
          Copy-Item LICENSE,README.md dist/
          Copy-Item docs/NATIVE-TYPES.md,docs/MEMORY-POINTERS.md,docs/MANAGED-VALUES.md,docs/STDLIB-STATUS.md dist/docs/
          Copy-Item -Recurse examples/ffi dist/examples/
          Copy-Item examples/native_typed.lsn,examples/native_text.lsn,examples/native_text_control.lsn,examples/native_text_functions.lsn dist/examples/
          Copy-Item -Recurse runtime dist/
          Compress-Archive -Path dist/* -DestinationPath lisan-native-Windows.zip
          $hash = (Get-FileHash lisan-native-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lisan-native-Windows.zip" | Set-Content -Encoding ascii lisan-native-Windows.sha256
      - name: Upload native compiler and machine code samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lisan-native-${{ runner.os }}
          path: |
            lisan-native-*.tar.gz
            lisan-native-*.zip
            lisan-native-*.sha256
          if-no-files-found: error
