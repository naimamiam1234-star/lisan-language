name: Rust CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit and integration tests
        run: cargo test --all-targets
      - name: Compile optimized interpreter
        run: cargo build --release
      - name: Run Arabic samples
        run: |
          cargo run -- examples/hello.lsn
          cargo run -- examples/dictionary.lsn
          cargo run -- examples/standard_library.lsn
          cargo run -- --tokens examples/dictionary.lsn
          cargo run -- --ast examples/dictionary.lsn
          cargo run -- examples/functions.lsn
          cargo run -- examples/lists.lsn
          cargo run -- examples/text.lsn
          cargo run -- examples/modules/main.lsn
          cargo run -- --check examples/modules/main.lsn
      - name: Package Linux/macOS interpreter
        if: runner.os != 'Windows'
        run: tar -czf lisan-${{ runner.os }}.tar.gz -C target/release lisan
      - name: Package Windows interpreter
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/lisan.exe -DestinationPath lisan-Windows.zip
      - name: Upload ready-to-run interpreter
        uses: actions/upload-artifact@v4
        with:
          name: lisan-${{ runner.os }}
          path: |
            lisan-*.tar.gz
            lisan-*.zip
          if-no-files-found: error
